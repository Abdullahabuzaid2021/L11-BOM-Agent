name: 🔄 Auto-Update BOM Dashboard

on:
  push:
    paths:
      - 'BOM/BOM_FINAL.xlsx'
      - 'BOM_CONSOLIDATED_FINAL_WITH_FOCUS_ID.xlsx'
      - '.github/workflows/update-dashboard.yml'
  schedule:
    # Run every day at 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions tab

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pandas

      - name: 📊 Extract BOM data from Excel
        run: |
          python scripts/extract_bom_data.py \
            BOM/BOM_FINAL.xlsx \
            bom_data.json

      - name: 📈 Check if data changed
        id: check
        run: |
          if [ -f "bom_data.json" ]; then
            echo "data_exists=true" >> $GITHUB_OUTPUT
            echo "✅ BOM data extracted successfully"
          else
            echo "data_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️  No BOM data found"
          fi

      - name: 🎨 Regenerate dashboard (if data changed)
        if: steps.check.outputs.data_exists == 'true'
        run: |
          python scripts/regenerate_dashboard.py \
            --input BOM/BOM_FINAL.xlsx \
            --template dashboard-templates/BOM_Dashboard_TEMPLATE_v2.html \
            --output BOM_Dashboard_Final.html

      - name: 📋 Copy to GitHub Pages
        if: steps.check.outputs.data_exists == 'true'
        run: |
          cp BOM_Dashboard_Final.html docs/dashboard/index.html
          cp BOM/BOM_FINAL.xlsx docs/dashboard/BOM_CONSOLIDATED_FINAL_WITH_FOCUS_ID.xlsx

      - name: 📝 Check for changes
        id: changes
        run: |
          git diff --name-only || true
          if git diff-index --quiet HEAD --; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: 🔧 Configure Git
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: ✨ Commit changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git add BOM_Dashboard_Final.html
          git add docs/dashboard/index.html
          git add docs/dashboard/BOM_CONSOLIDATED_FINAL_WITH_FOCUS_ID.xlsx
          git add bom_data.json || true

          # Create commit message with details
          TIMESTAMP=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          git commit -m "🔄 Auto: Dashboard regenerated from Excel

Dashboard regenerated on: $TIMESTAMP
Trigger: Automated workflow
Changes:
- Dashboard HTML updated
- GitHub Pages updated
- Data extracted from Excel
- All 3 sheets synchronized" || echo "⚠️  No changes to commit"

      - name: 🚀 Push changes
        if: steps.changes.outputs.has_changes == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

      - name: ✅ Workflow complete
        run: |
          echo "Dashboard update workflow completed successfully!"
          echo "✅ Excel data extracted"
          echo "✅ Dashboard regenerated"
          echo "✅ Changes committed and pushed"
          echo "📊 Dashboard will be live in 1-5 minutes"

      - name: 📢 Notification
        if: always()
        run: |
          echo "🔔 Dashboard Update Summary"
          echo "=========================="
          echo "Time: $(date)"
          echo "Status: Completed"
          echo "Next update: Daily at 12:00 UTC or on Excel changes"
