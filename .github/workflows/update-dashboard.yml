name: Auto-Update BOM Dashboard

on:
  push:
    paths:
      - 'BOM/BOM_FINAL.xlsx'
      - '.github/workflows/update-dashboard.yml'
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pandas

      - name: Extract BOM data from Excel
        run: |
          python scripts/extract_bom_data.py BOM/BOM_FINAL.xlsx bom_data.json

      - name: Check if data exists
        id: check
        run: |
          if [ -f "bom_data.json" ]; then
            echo "data_exists=true" >> $GITHUB_OUTPUT
          else
            echo "data_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Commit and push changes
        if: steps.check.outputs.data_exists == 'true'
        run: |
          git add bom_data.json
          git commit -m "Auto: Dashboard data updated from Excel" || echo "No changes to commit"
          git push origin main

      - name: Workflow complete
        run: echo "Dashboard update workflow completed"
